[package]
name = "connect-console"
version = "0.1.0"
edition = "2021"
description = "Connect operator console: organizations, people, machines, ACL"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
time = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.2"
hex = "0.4"
subtle = "2"
tower-cookies = "0.11"
clap = { version = "4", features = ["derive", "env"] }
connect-control-plane = { path = "../connect-control-plane" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
wasm-bindgen-cli-support = "=0.2.127"
